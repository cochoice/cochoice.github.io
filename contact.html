<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact · CoChoice</title>
  <meta name="description" content="Contactez l'équipe CoChoice." />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <script type="module" src="/src/scripts/main.js"></script>
</head>
<body>
  <!-- HEADER (identique sur toutes les pages vitrine) -->
  <header class="sticky top-0 z-50 border-b border-indigo/10 bg-white/90 backdrop-blur">
    <nav class="container-site flex h-16 items-center justify-between">
      <a href="index.html" aria-label="Accueil CoChoice"><img src="/logos/cochoice-logo.svg" alt="CoChoice" class="h-8" /></a>
      <button data-menu-toggle aria-expanded="false" aria-label="Menu" class="md:hidden text-2xl text-indigo">&#9776;</button>
      <ul data-menu class="hidden absolute inset-x-0 top-16 flex-col gap-4 bg-white p-4 md:static md:flex md:flex-row md:items-center md:gap-8 md:p-0 font-semibold text-indigo">
        <li><a href="index.html" class="hover:text-pervenche-texte">Accueil</a></li>
        <li><a href="a-propos.html" class="hover:text-pervenche-texte">À propos</a></li>
        <li><a href="contact.html" class="hover:text-pervenche-texte">Contact</a></li>
        <li><a href="landing.html" class="btn-primary py-2!">Rejoindre</a></li>
      </ul>
    </nav>
  </header>

  <main class="container-site py-16">
    <p class="surtitre">Contact</p>
    <h1 class="mt-2 text-4xl">Une question ? Écrivez-nous.</h1>
    <!-- Formulaire statique : brancher Formspree / Google Forms / Apps Script (action="") -->
    <form class="card mt-10 grid max-w-xl gap-4" action="" method="post">
      <label class="grid gap-1 font-semibold text-indigo">Nom<input name="nom" required class="rounded-xl border border-indigo/20 px-4 py-3 font-normal" /></label>
      <label class="grid gap-1 font-semibold text-indigo">Email<input type="email" name="email" required class="rounded-xl border border-indigo/20 px-4 py-3 font-normal" /></label>
      <label class="grid gap-1 font-semibold text-indigo">Message<textarea name="message" rows="5" required class="rounded-xl border border-indigo/20 px-4 py-3 font-normal"></textarea></label>
      <button class="btn-primary justify-self-start" type="submit">Envoyer</button>
    </form>
  </main>
  <!-- FOOTER -->
  <footer class="bg-indigo text-white">
    <div class="container-site flex flex-col items-center gap-4 py-10 text-center">
      <img src="/logos/cochoice-logo-dark.svg" alt="CoChoice" class="h-8" />
      <p class="font-bold">Mêmes droits, mêmes choix.</p>
      <p class="text-sm text-white/70">© <span data-year></span> CoChoice · Groupe 13 · Rocket School ChangeMaker Project</p>
    </div>
  </footer>
</body>
</html>
